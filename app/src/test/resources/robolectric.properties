# How JVM tests run under Robolectric.
#
# The SDK is pinned below targetSdk: Robolectric's support for the newest release trails it.
# SQLite and graphics use the legacy (pure JVM) implementations rather than Robolectric's native
# runtime, which fails to load from a path containing a space — such as a Windows home folder
# with one. The tests check SQL and semantics, not pixels, so neither needs the native runtime.
sdk=35
sqliteMode=LEGACY
graphicsMode=LEGACY
# A typical phone, rather than Robolectric's small default screen, so UI tests see what users do.
qualifiers=w411dp-h914dp-xxhdpi
